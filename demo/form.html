<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网申助手本地测试表单</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; color: #172033; font: 15px/1.6 system-ui, sans-serif; }
    h1 { margin-bottom: 6px; }
    fieldset { margin: 22px 0; padding: 20px; border: 1px solid #dbe2ef; border-radius: 12px; }
    legend { padding: 0 8px; font-weight: 700; }
    label { display: grid; gap: 6px; margin: 14px 0; }
    input, select, textarea, button { box-sizing: border-box; width: 100%; padding: 10px 12px; font: inherit; }
    .radio-row { display: flex; gap: 20px; }
    .radio-row label { display: flex; grid-template-columns: auto 1fr; align-items: center; }
    .radio-row input { width: auto; }
    .grid-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    h3 { margin: 20px 0 4px; font-size: 15px; }
    button { border: 0; border-radius: 8px; background: #3156d3; color: white; cursor: pointer; }
    #event-log { min-height: 60px; padding: 12px; border-radius: 8px; background: #f5f7fb; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>网申助手本地测试表单</h1>
  <p>用于检查文本框、下拉、日期/月份、单选多选、事件触发和敏感字段跳过行为。请通过本地 HTTP 服务打开。</p>

  <form id="application-form">
    <fieldset>
      <legend>基本信息</legend>
      <label>姓名<input name="name" type="text" autocomplete="name"></label>
      <label>手机号<input name="phone" type="tel" autocomplete="tel"></label>
      <label>邮箱<input name="email" type="email" autocomplete="email"></label>
      <label>性别
        <select name="gender">
          <option value="">请选择</option>
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="其他">其他</option>
        </select>
      </label>
      <div class="grid-row">
        <label>出生日期<input name="birthday" type="date"></label>
        <label>年龄（岁）<input name="age" type="number" min="16" max="70"></label>
      </div>
      <div class="grid-row">
        <label>民族
          <select name="nation">
            <option value="">请选择</option>
            <option value="汉族">汉族</option>
            <option value="蒙古族">蒙古族</option>
            <option value="回族">回族</option>
            <option value="藏族">藏族</option>
            <option value="维吾尔族">维吾尔族</option>
            <option value="苗族">苗族</option>
            <option value="壮族">壮族</option>
            <option value="满族">满族</option>
          </select>
        </label>
        <label>籍贯<input name="nativePlace" type="text" placeholder="如：江苏南京"></label>
      </div>
      <label>预计毕业日期<input name="graduationDate" type="date"></label>
      <div>政治面貌</div>
      <div class="radio-row" role="group" aria-label="政治面貌">
        <label><input name="politicalStatus" type="radio" value="中共党员">中共党员</label>
        <label><input name="politicalStatus" type="radio" value="共青团员">共青团员</label>
        <label><input name="politicalStatus" type="radio" value="群众">群众</label>
      </div>
      <label>婚姻状况
        <select name="marriage">
          <option value="">请选择</option>
          <option value="未婚">未婚</option>
          <option value="已婚">已婚</option>
          <option value="离异">离异</option>
        </select>
      </label>
      <div class="grid-row">
        <label>身高（cm）<input name="height" type="number" min="120" max="230"></label>
        <label>体重（kg）<input name="weight" type="number" min="30" max="200"></label>
      </div>
      <label>已有内容（应保留）<input name="existing" type="text" value="不要覆盖这段内容"></label>
    </fieldset>

    <fieldset>
      <legend>居住地与通讯</legend>
      <div class="grid-row">
        <label>所在省份
          <select name="liveProvince">
            <option value="">请选择</option>
            <option value="北京市">北京市</option>
            <option value="上海市">上海市</option>
            <option value="广东省">广东省</option>
            <option value="江苏省">江苏省</option>
            <option value="浙江省">浙江省</option>
            <option value="四川省">四川省</option>
            <option value="湖北省">湖北省</option>
            <option value="陕西省">陕西省</option>
          </select>
        </label>
        <label>城市<input name="liveCity" type="text" placeholder="如：南京"></label>
        <label>区县<input name="liveDistrict" type="text"></label>
      </div>
      <label>现居住地详细地址<input name="address" type="text" placeholder="街道、门牌号"></label>
      <div class="grid-row">
        <label>邮政编码<input name="zipcode" type="text" inputmode="numeric"></label>
        <label>户籍所在地<input name="householdRegistration" type="text"></label>
      </div>
      <label>通讯地址（寄送录用通知）<input name="mailingAddress" type="text"></label>
      <label>备用邮箱<input name="backupEmail" type="email"></label>
    </fieldset>

    <fieldset>
      <legend>紧急联系人（亲属）</legend>
      <div class="grid-row">
        <label>姓名<input name="emergencyContactName" type="text"></label>
        <label>与本人关系
          <select name="emergencyContactRelation">
            <option value="">请选择</option>
            <option value="父亲">父亲</option>
            <option value="母亲">母亲</option>
            <option value="配偶">配偶</option>
            <option value="兄弟姐妹">兄弟姐妹</option>
            <option value="亲属">亲属</option>
            <option value="朋友">朋友</option>
            <option value="其他">其他</option>
          </select>
        </label>
        <label>联系电话<input name="emergencyContactPhone" type="tel"></label>
      </div>
      <label>家庭电话<input name="homePhone" type="tel"></label>
    </fieldset>

    <fieldset>
      <legend>求职意向</legend>
      <label>应聘岗位
        <select name="applyPosition">
          <option value="">请选择</option>
          <option value="前端开发工程师">前端开发工程师</option>
          <option value="后端开发工程师">后端开发工程师</option>
          <option value="算法工程师">算法工程师</option>
          <option value="测试开发工程师">测试开发工程师</option>
          <option value="数据分析师">数据分析师</option>
          <option value="产品经理">产品经理</option>
        </select>
      </label>
      <label>意向工作城市（可多选）
        <select name="preferredCities" multiple size="4">
          <option value="北京">北京</option>
          <option value="上海">上海</option>
          <option value="深圳">深圳</option>
          <option value="杭州">杭州</option>
          <option value="南京">南京</option>
          <option value="成都">成都</option>
          <option value="广州">广州</option>
          <option value="西安">西安</option>
        </select>
      </label>
      <label>期望月薪
        <select name="expectedSalary">
          <option value="">请选择</option>
          <option value="8k-12k">8k-12k</option>
          <option value="12k-18k">12k-18k</option>
          <option value="18k-25k">18k-25k</option>
          <option value="25k-35k">25k-35k</option>
          <option value="面议">面议</option>
        </select>
      </label>
      <label>最早到岗时间<input name="earliestStartDate" type="date"></label>
      <label>求职类型
        <select name="jobType">
          <option value="">请选择</option>
          <option value="全职">全职</option>
          <option value="实习">实习</option>
          <option value="兼职">兼职</option>
        </select>
      </label>
      <div>是否接受调剂到其他城市</div>
      <div class="radio-row" role="group" aria-label="是否接受调剂">
        <label><input name="acceptTransfer" type="radio" value="是">是</label>
        <label><input name="acceptTransfer" type="radio" value="否">否</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>教育经历</legend>
      <h3>第一段（最高学历）</h3>
      <label>学校名称<input name="school1" type="text"></label>
      <div class="grid-row">
        <label>学历
          <select name="education1">
            <option value="">请选择</option>
            <option value="高中">高中</option>
            <option value="中专">中专</option>
            <option value="大专">大专</option>
            <option value="本科">本科</option>
            <option value="硕士">硕士</option>
            <option value="博士">博士</option>
          </select>
        </label>
        <label>学位
          <select name="degree1">
            <option value="">请选择</option>
            <option value="学士">学士</option>
            <option value="硕士">硕士</option>
            <option value="博士">博士</option>
            <option value="无">无</option>
          </select>
        </label>
      </div>
      <div class="grid-row">
        <label>专业<input name="major1" type="text"></label>
        <label>院系<input name="faculty1" type="text"></label>
      </div>
      <div class="grid-row">
        <label>开始时间<input name="educationStart1" type="month"></label>
        <label>结束时间<input name="educationEnd1" type="month"></label>
        <label>GPA<input name="gpa1" type="number" step="0.01" min="0" max="5"></label>
      </div>
      <label>是否第一学历
        <select name="isFirstDegree1">
          <option value="">请选择</option>
          <option value="是">是</option>
          <option value="否">否</option>
        </select>
      </label>

      <h3>第二段</h3>
      <label>学校名称<input name="school2" type="text"></label>
      <div class="grid-row">
        <label>学历
          <select name="education2">
            <option value="">请选择</option>
            <option value="高中">高中</option>
            <option value="大专">大专</option>
            <option value="本科">本科</option>
          </select>
        </label>
        <label>专业<input name="major2" type="text"></label>
      </div>
      <div class="grid-row">
        <label>开始时间<input name="educationStart2" type="month"></label>
        <label>结束时间<input name="educationEnd2" type="month"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>实习经历</legend>
      <h3>第一段实习</h3>
      <label>公司名称<input name="internCompany1" type="text"></label>
      <div class="grid-row">
        <label>岗位类别
          <select name="internCategory1">
            <option value="">请选择</option>
            <option value="技术研发">技术研发</option>
            <option value="产品">产品</option>
            <option value="运营">运营</option>
            <option value="市场">市场</option>
            <option value="职能支持">职能支持</option>
          </select>
        </label>
        <label>岗位名称<input name="internPosition1" type="text" placeholder="如：前端开发实习生"></label>
      </div>
      <div class="grid-row">
        <label>开始时间<input name="internStart1" type="month"></label>
        <label>结束时间<input name="internEnd1" type="month"></label>
        <label>工作地点<input name="internLocation1" type="text"></label>
      </div>
      <label>部门<input name="internDepartment1" type="text"></label>
      <label>主要工作内容概述<textarea name="internDuty1" rows="5" placeholder="描述你在该岗位的主要职责与产出"></textarea></label>
      <label>实习证明开具人<input name="internReferee1" type="text"></label>

      <h3>第二段实习</h3>
      <label>公司名称<input name="internCompany2" type="text"></label>
      <div class="grid-row">
        <label>岗位名称<input name="internPosition2" type="text"></label>
        <label>工作地点<input name="internLocation2" type="text"></label>
      </div>
      <div class="grid-row">
        <label>开始时间<input name="internStart2" type="month"></label>
        <label>结束时间<input name="internEnd2" type="month"></label>
      </div>
      <label>主要工作内容概述<textarea name="internDuty2" rows="4"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>项目经历</legend>
      <h3>项目一</h3>
      <label>项目名称<input name="projectName1" type="text"></label>
      <div class="grid-row">
        <label>担任角色
          <select name="projectRole1">
            <option value="">请选择</option>
            <option value="项目负责人">项目负责人</option>
            <option value="核心成员">核心成员</option>
            <option value="技术负责人">技术负责人</option>
            <option value="参与者">参与者</option>
          </select>
        </label>
        <label>项目类型
          <select name="projectType1">
            <option value="">请选择</option>
            <option value="课程设计">课程设计</option>
            <option value="学科竞赛">学科竞赛</option>
            <option value="科研项目">科研项目</option>
            <option value="自主项目">自主项目</option>
            <option value="企业项目">企业项目</option>
          </select>
        </label>
      </div>
      <div class="grid-row">
        <label>开始时间<input name="projectStart1" type="month"></label>
        <label>结束时间<input name="projectEnd1" type="month"></label>
      </div>
      <label>项目描述<textarea name="projectDesc1" rows="4" placeholder="项目背景、规模、技术栈"></textarea></label>
      <label>主要工作内容概述<textarea name="projectDuty1" rows="4" placeholder="你负责的部分与取得的成果"></textarea></label>
      <label>项目成果<input name="projectResult1" type="text"></label>

      <h3>项目二</h3>
      <label>项目名称<input name="projectName2" type="text"></label>
      <div class="grid-row">
        <label>担任角色<input name="projectRole2" type="text"></label>
        <label>开始时间<input name="projectStart2" type="month"></label>
        <label>结束时间<input name="projectEnd2" type="month"></label>
      </div>
      <label>项目描述<textarea name="projectDesc2" rows="4"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>技能与证书</legend>
      <div class="grid-row">
        <label>外语语种
          <select name="languageType">
            <option value="">请选择</option>
            <option value="英语">英语</option>
            <option value="日语">日语</option>
            <option value="韩语">韩语</option>
            <option value="德语">德语</option>
            <option value="法语">法语</option>
          </select>
        </label>
        <label>等级证书
          <select name="languageCertificate">
            <option value="">请选择</option>
            <option value="CET-4">CET-4</option>
            <option value="CET-6">CET-6</option>
            <option value="雅思">雅思</option>
            <option value="托福">托福</option>
          </select>
        </label>
        <label>成绩<input name="languageScore" type="text" placeholder="如：580"></label>
      </div>
      <label>计算机等级
        <select name="computerLevel">
          <option value="">请选择</option>
          <option value="全国计算机二级">全国计算机二级</option>
          <option value="全国计算机三级">全国计算机三级</option>
          <option value="软件设计师">软件设计师</option>
          <option value="无">无</option>
        </select>
      </label>
      <div>熟练掌握的技术栈（可多选）</div>
      <div class="radio-row" role="group" aria-label="技术栈">
        <label><input name="techStack" type="checkbox" value="JavaScript">JavaScript</label>
        <label><input name="techStack" type="checkbox" value="TypeScript">TypeScript</label>
        <label><input name="techStack" type="checkbox" value="React">React</label>
        <label><input name="techStack" type="checkbox" value="Vue">Vue</label>
        <label><input name="techStack" type="checkbox" value="Node.js">Node.js</label>
      </div>
      <label>专业技能<textarea name="professionalSkills" rows="3" placeholder="熟练 JavaScript / React；了解 Node.js"></textarea></label>
      <label>荣誉证书<input name="honors" type="text" placeholder="如：国家奖学金"></label>
      <label>获奖情况<textarea name="awards" rows="3"></textarea></label>
      <label>兴趣爱好<input name="hobbies" type="text"></label>
    </fieldset>

    <fieldset>
      <legend>校园经历与自我评价</legend>
      <label>担任学生干部职务<input name="campusDuty" type="text"></label>
      <label>社会实践经历<textarea name="socialPractice" rows="3"></textarea></label>
      <label>个人优势<textarea name="strengths" rows="5"></textarea></label>
      <label>自我评价<textarea name="selfEvaluation" rows="5"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>必须跳过</legend>
      <label>登录密码<input name="password" type="password"></label>
      <label>上传简历附件<input name="resumeFile" type="file" accept=".pdf,.doc,.docx"></label>
    </fieldset>

    <button type="submit">手动提交测试</button>
  </form>

  <h2>最近触发的事件</h2>
  <div id="event-log">尚无事件</div>
  <script>
    const log = document.getElementById("event-log");
    document.getElementById("application-form").addEventListener("input", (event) => {
      log.textContent = `input: ${event.target.name} = ${event.target.value}`;
    });
    document.getElementById("application-form").addEventListener("change", (event) => {
      log.textContent += `\nchange: ${event.target.name} = ${event.target.value}`;
    });
    document.getElementById("application-form").addEventListener("submit", (event) => {
      event.preventDefault();
      log.textContent += "\nsubmit: 仅由你手动触发";
    });
  </script>
</body>
</html>
